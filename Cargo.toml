[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.9"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enocone/enocone"
rust-version = "1.88"

[workspace.dependencies]
enocone-spec = { path = "crates/enocone-spec" }
enocone-engine = { path = "crates/enocone-engine" }
enocone-driver-playwright = { path = "crates/enocone-driver-playwright" }
enocone-report = { path = "crates/enocone-report" }
enocone-mcp = { path = "crates/enocone-mcp" }
enocone-fixture = { path = "crates/enocone-fixture" }
enocone-hub = { path = "crates/enocone-hub" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
playwright-rs = "0.20.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "cookies", "form", "query"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_json_path = "0.7.2"
serde_norway = "0.9.42"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2"
