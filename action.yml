name: enocone
description: Run enocone business flows and publish the report
branding:
  icon: check-circle
  color: blue

inputs:
  project:
    description: Folder containing enocone.toml
    default: .
  env:
    description: Environment from enocone.toml (default — the project's default_env)
    default: ""
  args:
    description: Extra arguments for `enocone run` (e.g. `--tag smoke --retries 1`)
    default: ""
  report-name:
    description: Name of the uploaded report artifact
    default: enocone-report
  browsers:
    description: Browsers to install (space separated), or `none` for HTTP-only suites
    default: chromium
  publish:
    description: >-
      Send the run to the team site named under [hub] in enocone.toml. Needs
      `permissions: id-token: write` (GitHub vouches for the workflow), or an
      ENOCONE_HUB_TOKEN secret in the environment.
    default: "false"

outputs:
  exit-code:
    description: 0 ok, 1 failures, 2 flow document errors, 3 could not run
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path of the report folder
    value: ${{ steps.run.outputs.report }}
  url:
    description: Where the published run can be read (when publish is true)
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    # The action builds enocone from its own checkout, so `uses: enocone/enocone@<ref>`
    # pins the version. The cache key is a hash of that source (hashFiles can't
    # see the action's folder when it is outside the workspace).
    - name: Fingerprint enocone source
      id: src
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        hash=$(find Cargo.toml Cargo.lock crates -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -c1-16)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Cache enocone and browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/enocone-bin
          ~/.cache/playwright-rust
          ~/.cache/ms-playwright
        key: enocone-${{ runner.os }}-${{ steps.src.outputs.hash }}

    - name: Build enocone
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --path "${{ github.action_path }}/crates/enocone-cli" --root ~/.cache/enocone-bin

    - name: Put enocone on PATH
      shell: bash
      run: |
        echo "$HOME/.cache/enocone-bin/bin" >> "$GITHUB_PATH"
        "$HOME/.cache/enocone-bin/bin/enocone" --version

    - name: Install browsers
      if: inputs.browsers != 'none'
      shell: bash
      run: enocone install-browsers ${{ inputs.browsers }} --with-deps

    - name: Run flows
      id: run
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        set +e
        ENV_ARG=""
        if [ -n "${{ inputs.env }}" ]; then ENV_ARG="--env ${{ inputs.env }}"; fi
        enocone run $ENV_ARG --out enocone-report ${{ inputs.args }}
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=${{ inputs.project }}/enocone-report" >> "$GITHUB_OUTPUT"
        exit $code

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.project }}/enocone-report
        if-no-files-found: ignore

    - name: Publish to the team site
      id: publish
      if: always() && inputs.publish == 'true'
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        if [ ! -f enocone-report/results.json ]; then
          echo "::notice title=enocone::Nothing to publish: the run didn't produce results.json."
          exit 0
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "${ENOCONE_HUB_TOKEN:-}" ]; then
          echo "::notice title=enocone::Not publishing: this job can't get an OIDC token. Add 'permissions: id-token: write' (pull requests from forks never get one)."
          exit 0
        fi
        if url=$(enocone publish); then
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=enocone::Published $url"
          echo "Published to [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning title=enocone::Publishing failed; the report is still in the uploaded artifact."
        fi
