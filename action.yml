name: enocone
description: Run enocone business flows and publish the report
branding:
  icon: check-circle
  color: blue

inputs:
  project:
    description: Folder containing enocone.toml
    default: .
  env:
    description: Environment from enocone.toml (default — the project's default_env)
    default: ""
  args:
    description: Extra arguments for `enocone run` (e.g. `--tag smoke --retries 1`)
    default: ""
  report-name:
    description: Name of the uploaded report artifact
    default: enocone-report
  browsers:
    description: Browsers to install (space separated), or `none` for HTTP-only suites
    default: chromium
  upload:
    description: When to upload the report as an artifact - `always`, `on-failure` or `never`
    default: always
  retention-days:
    description: Days to keep the uploaded report (0 - the repository's default)
    default: "0"
  publish:
    description: >-
      Send the run to the team site named under [hub] in enocone.toml. Needs
      `permissions: id-token: write` (GitHub vouches for the workflow), or an
      ENOCONE_HUB_TOKEN secret in the environment.
    default: "false"

outputs:
  outcome:
    description: passed, failed, invalid (flow document errors) or error (could not run)
    value: ${{ steps.run.outputs.outcome }}
  passed:
    description: How many flows passed
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: How many flows failed
    value: ${{ steps.run.outputs.failed }}
  report-url:
    description: The published run's link (when publish is true and it was published)
    value: ${{ steps.publish.outputs.url }}
  exit-code:
    description: 0 ok, 1 failures, 2 flow document errors, 3 could not run
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path of the report folder
    value: ${{ steps.run.outputs.report }}
  url:
    description: Where the published run can be read (when publish is true)
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    # The action builds enocone from its own checkout, so `uses: driftwerk/enocone@<ref>`
    # pins the version. The cache key is a hash of that source (hashFiles can't
    # see the action's folder when it is outside the workspace).
    - name: Fingerprint enocone source
      id: src
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        hash=$(find Cargo.toml Cargo.lock crates -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -c1-16)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Cache enocone and browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/enocone-bin
          ~/.cache/playwright-rust
          ~/.cache/ms-playwright
        key: enocone-${{ runner.os }}-${{ steps.src.outputs.hash }}

    - name: Build enocone
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --path "$GITHUB_ACTION_PATH/crates/enocone-cli" --root ~/.cache/enocone-bin

    - name: Put enocone on PATH
      shell: bash
      run: |
        echo "$HOME/.cache/enocone-bin/bin" >> "$GITHUB_PATH"
        "$HOME/.cache/enocone-bin/bin/enocone" --version

    - name: Install browsers
      if: inputs.browsers != 'none'
      shell: bash
      env:
        INPUT_BROWSERS: ${{ inputs.browsers }}
      # One argument per browser name, so the list is split on spaces.
      run: enocone install-browsers $INPUT_BROWSERS --with-deps

    - name: Run flows
      id: run
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_UPLOAD: ${{ inputs.upload }}
      run: bash "$GITHUB_ACTION_PATH/action/enocone-action.sh" run

    - name: Upload report
      if: always() && steps.run.outputs.upload == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.project }}/enocone-report
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}

    - name: Publish to the team site
      id: publish
      if: always() && inputs.publish == 'true'
      shell: bash
      working-directory: ${{ inputs.project }}
      run: bash "$GITHUB_ACTION_PATH/action/enocone-action.sh" publish
