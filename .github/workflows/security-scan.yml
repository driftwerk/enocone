name: Security scan

# Daily: known vulnerabilities (Trivy) and end-of-life software (xeol) in the
# workspace's dependencies and in the Docker image built from ./Dockerfile.
# Findings land in one GitHub issue, which closes itself once a scan is clean.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/security_scan.py'
      - '.github/scripts/security-scan-issue.sh'
      - '.github/workflows/security-scan.yml'
      - 'Dockerfile'

permissions:
  contents: read
  issues: write

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan dependencies and the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the image
        run: docker build -t enocone:scan .

      - name: Scan
        id: scan
        run: |
          python3 .github/scripts/security_scan.py \
            --title "Security scan: enocone" \
            --image enocone:scan \
            --tree . \
            --report /tmp/security-report.md \
            && echo "action=false" >> "$GITHUB_OUTPUT" \
            || echo "action=true" >> "$GITHUB_OUTPUT"
          cat /tmp/security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the findings issue
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.scan.outputs.action }}
        run: .github/scripts/security-scan-issue.sh /tmp/security-report.md

      - name: Fail when something needs action
        if: steps.scan.outputs.action == 'true'
        run: |
          echo "::error::The security scan found CRITICAL vulnerabilities with fixes, or end-of-life software. See the job summary."
          exit 1
