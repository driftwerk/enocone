name: release
# Tag a version (git tag v0.2.0 && git push --tags) to build the Linux binary
# that `enocone serve` deployments install. The archive holds `enocone` at
# its root; the .sha256 file beside it is what deployments check.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    # Built on an older Ubuntu so the binary's glibc also runs on newer ones.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p enocone-cli
      - name: Package
        run: |
          name=enocone-x86_64-unknown-linux-gnu.tar.gz
          tar -czf "$name" -C target/release enocone
          sha256sum "$name" | cut -d' ' -f1 > "$name.sha256"
          ./target/release/enocone --version
          cat "$name.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            enocone-x86_64-unknown-linux-gnu.tar.gz enocone-x86_64-unknown-linux-gnu.tar.gz.sha256
